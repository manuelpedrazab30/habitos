<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Tu panel personal: hábitos y finanzas.">
  <title>Panel personal</title>

  <!-- Instalable: pantalla de inicio de iPhone (Compartir → Añadir a pantalla de inicio) y Android -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Panel">
  <!-- La barra de estado se superpone; .topbar reserva env(safe-area-inset-top) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior y navegación inferior: las rellena src/app.js según la sección (Hábitos / Finanzas) -->
  <header class="topbar">
    <nav class="section-switch" id="sections" aria-label="Secciones"></nav>
    <div id="level"></div>
  </header>
  <main id="view"></main>
  <nav class="nav" id="nav" aria-label="Principal"></nav>
  <script type="module" src="src/app.js"></script>
</body>
</html>
